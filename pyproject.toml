[project]
name = "awg-dashboard"
version = "0.0.1"
description = "AmneziaWG server management dashboard"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "cryptography>=46.0.0",
    "fastapi>=0.115.0",
    "segno>=1.6.6",
    "uvicorn>=0.34.0",
]

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx2>=0.1.0",
    "ruff>=0.17.4",
]

[tool.ruff]
line-length = 80

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
